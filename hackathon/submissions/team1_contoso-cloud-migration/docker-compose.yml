version: "3.9"

# Local environment = cloud equivalent:
#   backend  → ECS Fargate service
#   frontend → ECS Fargate service (or CloudFront + S3 in prod)
#   minio    → Amazon S3
#   postgres → Amazon RDS for SQL Server (Postgres used locally as proxy)
#   redis    → Amazon ElastiCache

services:
  backend:
    build:
      context: ../../../..
      dockerfile: hackathon/submissions/team1_contoso-cloud-migration/Dockerfile.backend
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=contoso
      - DB_USER=contoso
      - DB_PASSWORD=contoso_local
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=recon-inbound
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../../../..
      dockerfile: hackathon/submissions/team1_contoso-cloud-migration/Dockerfile.frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

  # Amazon S3 equivalent (local)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Amazon RDS equivalent (local) — SQL Server schema migrated to Postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contoso
      POSTGRES_USER: contoso
      POSTGRES_PASSWORD: contoso_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contoso"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Amazon ElastiCache equivalent (local)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  minio_data:
  postgres_data:
